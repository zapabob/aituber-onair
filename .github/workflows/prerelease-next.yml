name: prerelease-next

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest

    steps:
    # 1) Checkout the repository with full history (tags included)
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2) Select a release-notes range. New repositories may have no stable tag yet.
    - name: Determine release-notes range
      id: range
      run: |
        stable_tag=$(git describe --tags --abbrev=0 --exclude='next' \
          --exclude='*-rc*' 2>/dev/null || true)
        if [ -n "$stable_tag" ]; then
          range="$stable_tag..HEAD"
        elif git rev-parse --verify --quiet refs/tags/next >/dev/null; then
          range="next..HEAD"
        else
          range="HEAD"
        fi
        echo "range=$range" >>"$GITHUB_OUTPUT"

    # 3) Generate release notes from the selected range
    - name: Generate release notes
      id: notes
      run: |
        git log "${{ steps.range.outputs.range }}" \
                --pretty=format:'* %s (%h)' --reverse > RELEASE_NOTES.md
        echo "notes_path=RELEASE_NOTES.md" >>"$GITHUB_OUTPUT"

    # 4) Create or update the 'next' prerelease
    - name: Publish prerelease
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: next                    # Fixed tag that will be overwritten
        name: Nightly – ${{ github.sha }} # Release title
        body_path: ${{ steps.notes.outputs.notes_path }}
        prerelease: true                  # Mark as prerelease
        generate_release_notes: false     # Use our custom notes
